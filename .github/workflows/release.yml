name: release

# Cerebra takes @pib/robot-view as a versioned tarball from a release. A plain git
# dependency cannot work here: the package lives in packages/robot-view, and `npm i
# github:...` installs the repository root, which has no package.json.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build the package for"
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: build the library
        run: |
          cd packages/robot-view
          npm ci
          npm run build:lib

      - name: pack
        id: pack
        run: |
          cd packages/robot-view
          npm pack --pack-destination "$RUNNER_TEMP"
          echo "tgz=$(ls "$RUNNER_TEMP"/*.tgz)" >> "$GITHUB_OUTPUT"

      - name: upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "pib-robot-view $TAG"
          gh release upload "$TAG" "${{ steps.pack.outputs.tgz }}" --clobber
